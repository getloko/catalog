# Collaboration & Productivity Workloads
workloads:
  excalidraw:
    category: collaboration
    description: Virtual collaborative whiteboard for sketching hand-drawn diagrams
    chart:
      repo: excalidraw
      name: excalidraw/excalidraw
      # renovate: datasource=helm depName=excalidraw repositoryUrl=https://pmoscode-helm.github.io/excalidraw
      version: "0.18.0"
    defaults:
      namespace: loko-system
      ports: []
    mappings: {}
    presets:
      excalidraw:
        service:
          type: ClusterIP
          port: 80
        ingress:
          enabled: true
          <<: *ingress-traefik
          className: traefik
          host: excalidraw.${LOKO_DOMAIN}
          path: /
          type: Prefix
          tls:
            host: excalidraw.${LOKO_DOMAIN}
        # Point collab server URL to the in-cluster service (browser connects via same ingress)
        customCollabServerURL: "https://excalidraw.${LOKO_DOMAIN}"
      collabServer:
        enabled: true
        service:
          type: ClusterIP
          port: 3002
    endpoints:
      - name: web-ui
        service: excalidraw-main
        protocol: https
        port: 80
        description: Excalidraw web interface
    connection-strings:
      - name: web-ui
        template: "${URL}"
    health-checks:
      - name: http
        type: http
        tier: infrastructure
        target: web-ui
        path: /
        description: Check if Excalidraw web UI is accessible

  penpot:
    category: collaboration
    description: Open-source design and prototyping platform (Figma alternative)
    chart:
      repo: penpot
      name: penpot/penpot
      # renovate: datasource=helm depName=penpot repositoryUrl=https://helm.penpot.app
      version: "1.9.0"
    defaults:
      namespace: loko-system
      ports: []
      storage:
        size: 20Gi
    mappings:
      storage: persistence.assets.size
    secrets: {}  # Auth managed via registration; database credentials come from the postgres workload's secret
    # Penpot chart >= 1.x ships no database subcharts (it hard-fails on the old
    # global.postgresqlEnabled/valkeyEnabled flags), so Penpot uses loko's own
    # postgres and valkey workloads.
    requires:
      - workload: postgres
        required: true
        reason: "Database backend (the Penpot chart no longer bundles PostgreSQL)"
      - workload: valkey
        required: true
        reason: "Cache, sessions and real-time messaging (the Penpot chart no longer bundles Valkey)"
    presets:
      config:
        publicUri: "https://penpot.${LOKO_DOMAIN}"
        # Disable email verification and SMTP for local dev; enable core login features
        flags: "enable-registration enable-login-with-password disable-email-verification"
        telemetryEnabled: false
        postgresql:
          host: "postgres.${LOKO_SYSTEM_WORKLOADS_NAMESPACE}.svc.cluster.local"
          port: 5432
          # The postgres workload's default database; loko does not provision
          # per-application databases for Penpot.
          database: "postgres"
          username: "postgres"
          # Superuser password generated by the postgres workload
          existingSecret: postgres  # pragma: allowlist secret
          secretKeys:
            passwordKey: POSTGRES_PASSWORD  # pragma: allowlist secret
        redis:
          host: "valkey.${LOKO_SYSTEM_WORKLOADS_NAMESPACE}.svc.cluster.local"
          port: 6379
          database: "0"
      ingress:
        enabled: true
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        className: traefik
        path: /
        hosts:
          - penpot.${LOKO_DOMAIN}
        tls:
          - hosts:
              - penpot.${LOKO_DOMAIN}
    endpoints:
      - name: web-ui
        protocol: https
        port: 8080
        description: Penpot web interface
    connection-strings:
      - name: web-ui
        template: "${URL}"
    health-checks:
      - name: ui
        type: http
        tier: client
        target: web-ui
        path: /
        description: Check if Penpot web UI is accessible
