# Example Workloads
example-workloads:
  http:
    name: echo-server
    description: HTTP request echo service with Traefik ingress
    category: utility
    workload:
      name: echo-server
      enabled: false
      namespace: default
      config:
        repo:
          ref: bjw-s
        chart: bjw-s/app-template
        version: "5.0.0"
        values:
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: ealen/echo-server
                    # renovate: datasource=docker depName=ealen/echo-server
                    tag: "0.9.2"
          service:
            main:
              controller: main
              ports:
                http:
                  port: 80
          ingress:
            main:
              enabled: true
              className: traefik
              hosts:
                - host: echo.${LOKO_APPS_DOMAIN}
                  paths:
                    - path: /
                      pathType: Prefix
                      service:
                        identifier: main
                        port: http
              tls:
                - hosts:
                    - echo.${LOKO_APPS_DOMAIN}
    notes: |
      HTTP workloads use Traefik ingress for routing. No TCP ports or
      cluster recreation needed. Access via: https://echo.<apps-domain>

  tcp:
    name: tcp-echo
    description: TCP service requiring port exposure and TCPIngressRoute
    category: utility
    workload:
      name: tcp-echo
      enabled: false
      namespace: default
      ports: [9000]
      config:
        repo:
          ref: istio
        chart: istio/tcp-echo-server
        version: "1.2.0"
        values:
          service:
            type: ClusterIP
            ports:
              - port: 9000
                name: tcp
                protocol: TCP
    notes: |
      TCP workloads require:
      1. Port exposed at cluster creation (requires 'loko recreate' to change)
      2. DNS host record configuration (via dnsmasq)
      3. Traefik TCPIngressRoute for routing (automatically configured)

      Access via: telnet tcp-echo.<domain> 9000
